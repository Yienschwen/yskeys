name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json "packageManager", so local and CI cannot drift.
      # v6 is required: earlier majors do not handle pnpm 12's native executable.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      # Do NOT add `enablement: true` here. Creating a Pages site requires a user
      # token; GITHUB_TOKEN answers POST /repos/{owner}/{repo}/pages with
      # "Resource not accessible by integration" and the step fails. Pages must be
      # enabled once by a human: Settings -> Pages -> Source = GitHub Actions.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
